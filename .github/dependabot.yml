version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # typescript-eslint doesn't support TS >=6.1 yet (as of writing, only
      # up to <6.1.0): https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # A prior major bump (to 7.0.2) merged without anyone checking that CI
      # was red, breaking lint/build on main until this was caught. Revisit
      # once that issue is resolved.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
